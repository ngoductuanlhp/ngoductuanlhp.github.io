- id: DAGE
  title: "DAGE: Dual-Stream Architecture for Efficient and Fine-Grained Geometry Estimation"
  highlight: true
  venue: CVPR, 2026
  description: "Recovers sharp, view-consistent geometry and accurate camera poses from uncalibrated videos **at up to 2K resolution**, using a **dual-stream transformer** that separates global context from fine detail."
  project_page: "https://ngoductuanlhp.github.io/dage-site/"
  github: ngoductuanlhp/DAGE
