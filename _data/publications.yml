- id: GaPro
  title: "GaPro: Box-Supervised 3D Point Cloud Instance Segmentation Using Gaussian Processes as Pseudo Labelers"
  venue: ICCV, 2023
  description: "Learns 3D point cloud instance segmentation **from bounding boxes alone**, using **Gaussian Processes** to turn box annotations into pseudo instance masks, and performs competitively with fully supervised methods."
