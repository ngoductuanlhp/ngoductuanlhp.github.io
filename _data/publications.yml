- id: VolFill
  title: "VolFill: Single-View Amodal 3D Scene Reconstruction with Volumetric Flow Matching"
  highlight: true
  venue: NeurIPS, 2026
  description: "Reconstructs the **complete 3D scene from a single RGB image**, including **surfaces hidden behind visible geometry**, by generating a structured volumetric representation instead of regressing per-pixel depth."
  project_page: "https://ngoductuanlhp.github.io/VolFill/"
  github: ngoductuanlhp/VolFill
  arxiv: "2605.31466"
