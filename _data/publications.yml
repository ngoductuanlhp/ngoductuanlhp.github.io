- id: Open3DIS
  title: "Open3DIS: Open-vocabulary 3D Instance Segmentation with 2D Mask Guidance"
  highlight: true
  venue: CVPR, 2024
  description: "Segments 3D object instances from open-vocabulary queries by **lifting 2D instance masks** across frames into 3D proposals, recovering **small and geometrically ambiguous objects** that 3D-only methods miss."
  project_page: "https://open3dis.github.io/"
  github: VinAIResearch/Open3DIS
